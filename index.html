"wn\"><\/span><label>Zoom <input id=\"zm\" type=\"number\" value=\"80\" min=\"30\" max=\"200\" step=\"10\" style=\"width:64px\">%<\/label><button onclick=\"__toword()\">📄 Word (.docx)<\/button><button class=\"p\" onclick=\"print()\">🖨 প্রিন্ট / PDF<\/button><\/div>\n<div class=\"panel\"><div class=\"tabs\"><button data-t=\"st\" class=\"on\">⚙ সেটিংস<\/button><button data-t=\"qs\">📝 প্রশ্ন<\/button><button data-t=\"io\">📥 ইমপোর্ট/এক্সপোর্ট<\/button><\/div>\n<div id=\"st\"><\/div><div id=\"qs\" hidden><\/div>\n<div id=\"io\" hidden><small>ছবি/টেক্সট চ্যাটে Claude-কে দিন, সে নিচের ফরম্যাটে JSON বানিয়ে দেবে; সেটা এখানে পেস্ট করে \"যোগ করুন\" চাপুন।<br>ফরম্যাট: [{\"type\":\"mcq|short|long\",\"q\":\"প্রশ্ন\",\"o\":[\"ক\",\"খ\",\"গ\",\"ঘ\"],\"sub\":[\"ক) ...\",\"খ) ...\"],\"marks\":\"1\"}]<br>বক্স/ছক: {\"kind\":\"box\",\"cap\":\"শব্দভান্ডার\",\"cells\":[[\"ক\",\"খ\"],[\"গ\",\"ঘ\"]]} (সারি-কলাম পরে বদলানো যায়) · হেডার: {\"type\":\"hdr\",\"rows\":[[\"শিরোনাম\"],[\"শ্রেণি: ৩য়\",\"পূর্ণমান: ৫০\"]]}<br>গণিত: x^{2}, H_{2}O, ভগ্নাংশ F{h|2π}<\/small>\n<textarea id=\"imp\" rows=\"9\" placeholder=\"JSON পেস্ট করুন\"><\/textarea><div class=\"mini\"><button class=\"p\" id=\"addj\">যোগ করুন<\/button><button id=\"expj\">বর্তমান প্রশ্ন এক্সপোর্ট<\/button><button id=\"expf\">সেকশনসহ এক্সপোর্ট<\/button><button id=\"rst\">সব রিসেট<\/button><button id=\"clr\">শুধু প্রশ্ন মুছুন<\/button><\/div><\/div><\/div>\n<div id=\"ts\" style=\"display:none;position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;z-index:9;max-width:90%\"><\/div><div class=\"pv\"><div id=\"sheets\"><\/div><\/div><\/div>\n<script>\nconst BN=['Noto Serif Bengali','Noto Sans Bengali','Hind Siliguri','Anek Bangla','Atma','Baloo Da 2','Galada','Mina','Tiro Bangla','Nirmala UI','SolaimanLipi','Kalpurush','Siyam Rupali','Nikosh','NikoshBAN','AdorshoLipi','Mukti','Vrinda','Shonar Bangla','Lohit Bengali'],\nEN=['Times New service cloud.firestore {
  match /databases/{db}/documents {
    function verified() { return request.auth != null && request.auth.token.email_verified == true; }

    match /{document=**} {

    }
    match /access/{email} {
      allow read: if verified() && request.auth.token.email.lower() == email;
    }
    match /orgs/{org} {
      allow read: if member(org);
    }
    match /orgs/{org}/pdfs/{id} {

function ReArrangeUnicodeConvertedText(str) {
  for (var i = 0; i < str.length; i++) {
    if (
      i > 0 &&
      str.charAt(i) == "\u09CD" &&
      (IsBanglaKar(str.charAt(i - 1)) || IsBanglaNukta(str.charAt(i - 1))) &&
      i < str.length - 1
    ) {
      var temp = str.substring(0, i - 1);
      temp += str.charAt(i);
      temp += str.charAt(i + 1);
      temp += str.charAt(i - 1);
      temp += str.substring(i + 2, str.length);
      str = temp;
    }
    if (
      i > 0 &&
      i < str.length - 1 &&
      str.charAt(i) == "\u09CD" &&
      str.charAt(i - 1) == "\u09B0" &&
      str.charAt(i - 2) != "\u09CD" &&
      IsBanglaKar(str.charAt(i + 1))
    ) {
      var temp = str.substring(0, i - 1);
      temp += str.charAt(i + 1);
      temp += str.charAt(i - 1);
      temp += str.charAt(i);
      temp += str.substring(i + 2, str.length);
      str = temp;
    }
    if (
      i < str.length - 1 &&
      str.charAt(i) == "র" &&
      IsBanglaHalant(str.charAt(i + 1)) &&
      !IsBanglaHalant(str.charAt(i - 1))
    ) {
      var j = 1;
      while (true) {
        if (i - j < 0) break;
        if (
          IsBanglaBanjonborno(str.charAt(i - j)) &&
          IsBanglaHalant(str.charAt(i - j - 1))
        )
          j += 2;
        else if (j == 1 && IsBanglaKar(str.charAt(i - j))) j++;
        else break;
      }
      var temp = str.substring(0, i - j);
      temp += str.charAt(i);
      temp += str.charAt(i + 1);
      temp += str.substring(i - j, i);
      temp += str.substring(i + 2, str.length);
      str = temp;
      i += 1;
      continue;
    }
    if (
      i < str.length - 1 &&
      IsBanglaPreKar(str.charAt(i)) &&
      IsSpace(str.charAt(i + 1)) == false
    ) {
      var temp = str.substring(0, i);
      var j = 1;
      while (IsBanglaBanjonborno(str.charAt(i + j))) {
        if (IsBanglaHalant(str.charAt(i + j + 1))) j += 2;
        else break;
      }
      temp += str.substring(i + 1, i + j + 1);
      var l = 0;
      if (str.charAt(i) == "ে" && str.charAt(i + j + 1) == "া") {
        temp += "ো";
        l = 1;
      } else if (str.charAt(i) == "ে" && str.charAt(i + j + 1) == "ৗ") {
        temp += "ৌ";
        l = 1;
      } else temp += str.charAt(i);
      temp += str.substring(i + j + l + 1, str.length);
      str = temp;
      i += j;
    }
    if (
      i < str.length - 1 &&
      str.charAt(i) == "ঁ" &&
      IsBanglaPostKar(str.charAt(i + 1))
    ) {
      var temp = str.substring(0, i);
      temp += str.charAt(i + 1);
      temp += str.charAt(i);
      temp += str.substring(i + 2, str.length);
      str = temp;
    }
  }
  return str;
}

function ReArrangeUnicodeText(str) {
  var barrier = 0;
  for (var i = 0; i < str.length; i++) {
    if (i < str.length && IsBanglaPreKar(str.charAt(i))) {
      var j = 1;
      while (IsBanglaBanjonborno(str.charAt(i - j))) {
        if (i - j < 0) break;
        if (i - j <= barrier) break;
        if (IsBanglaHalant(str.charAt(i - j - 1))) j += 2;
        else break;
      }
      var temp = str.substring(0, i - j);
      temp += str.charAt(i);
      temp += str.substring(i - j, i);
      temp += str.substring(i + 1, str.length);
      str = temp;
      barrier = i + 1;
      continue;
    }
    if (
      i < str.length - 1 &&
      IsBanglaHalant(str.charAt(i)) &&
      str.charAt(i - 1) == "র" &&
      !IsBanglaHalant(str.charAt(i - 2))
    ) {
      var j = 1;
      var found_pre_kar = 0;
      while (true) {
        if (
          IsBanglaBanjonborno(str.charAt(i + j)) &&
          IsBanglaHalant(str.charAt(i + j + 1))
        )
          j += 2;
        else if (
          IsBanglaBanjonborno(str.charAt(i + j)) &&
          IsBanglaPreKar(str.charAt(i + j + 1))
        ) {
          found_pre_kar = 1;
          break;
        } else break;
      }
      var temp = str.substring(0, i - 1);
      temp += str.substring(i + j + 1, i + j + found_pre_kar + 1);
      temp += str.substring(i + 1, i + j + 1);
      temp += str.charAt(i - 1);
      temp += str.charAt(i);
      temp += str.substring(i + j + found_pre_kar + 1, str.length);
      str = temp;
      i += j + found_pre_kar;
      barrier = i + 1;
      continue;
    }
  }
  return str;
}
function ConvertToASCII(ConvertTo, line) {
  var conversion_map = uni2bijoy_string_conversion_map;
  if (ConvertTo == "bijoy") conversion_map = uni2bijoy_string_conversion_map;
  else if (ConvertTo == "somewherein")
    conversion_map = uni2somewherein_string_conversion_map;
  else if (ConvertTo == "boisakhi")
    conversion_map = uni2boisakhi_string_conversion_map;
  var myRegExp;
  myRegExp = new RegExp("ো", "g");
  line = line.replace(myRegExp, "ো");
  myRegExp = new RegExp("ৌ", "g");
  line = line.replace(myRegExp, "ৌ");
  line = ReArrangeUnicodeText(line);
  for (var unic in conversion_map) {
    myRegExp = new RegExp(unic, "g");
    line = line.replace(myRegExp, conversion_map[unic]);
  }
  return line;
}
