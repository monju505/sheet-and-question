<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>প্রশ্নপত্র নির্মাতা</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;700&family=Atma:wght@400;700&family=Baloo+Da+2:wght@400;700&family=Galada&family=Hind+Siliguri:wght@400;600&family=Mina:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&family=Noto+Serif+Bengali:wght@400;700&family=Tiro+Bangla&family=Roboto:wght@400;700&family=Merriweather:wght@400;700&family=Open+Sans:wght@400;700&family=Lato:wght@400;700&family=Montserrat:wght@400;700&family=Poppins:wght@400;700&family=Inter:wght@400;700&family=Lora:wght@400;700&family=Playfair+Display:wght@400;700&family=PT+Serif:wght@400;700&family=EB+Garamond:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--pn:#fff;--tx:#1f2937;--bd:#d1d5db;--ac:#1d4ed8;--mu:#6b7280}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111827;--pn:#1f2937;--tx:#e5e7eb;--bd:#374151;--ac:#60a5fa;--mu:#9ca3af}}
:root[data-theme=dark]{--bg:#111827;--pn:#1f2937;--tx:#e5e7eb;--bd:#374151;--ac:#60a5fa;--mu:#9ca3af}
*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:14px system-ui,"Hind Siliguri",sans-serif}
.app{display:grid;grid-template-columns:400px 1fr;grid-template-rows:auto 1fr;height:100%}
.bar{grid-column:1/3;display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd)}
.bar b{flex:1;font-size:16px}.bar{box-shadow:0 1px 4px #0002}.panel{scrollbar-width:thin}.tabs button{padding:7px 4px;font-weight:600}#wn{color:#dc2626;font-weight:600}
.panel{overflow:auto;background:var(--pn);border-right:1px solid var(--bd);padding:10px}
.pv{overflow:auto;padding:16px;background:var(--bg)}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:5px 8px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
textarea{width:100%;resize:vertical}input,select{max-width:100%}
.tabs{display:flex;gap:4px;margin-bottom:10px}.tabs button{flex:1}.tabs .on{background:var(--ac);color:#fff}
.row{display:grid;grid-template-columns:1fr 1.2fr;gap:6px;align-items:center;margin:5px 0}.row label{color:var(--mu)}
details.g{border:1px solid var(--bd);border-radius:10px;margin:8px 0;overflow:hidden}details.g summary{cursor:pointer;padding:9px 12px;font-weight:700;background:var(--bg);list-style:none}details.g[open] summary{border-bottom:1px solid var(--bd)}details.g>div{padding:0 12px}details.g>div:last-child{padding-bottom:8px}.hint{color:var(--mu);font-size:12px;margin:4px 0 8px}
.card{border:1px solid var(--bd);border-radius:8px;padding:8px;margin:8px 0}.card .q{border-top:1px dashed var(--bd);margin-top:8px;padding-top:8px}
.mini{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}.mini input{flex:1;min-width:70px}.mini input[type=checkbox]{flex:none;min-width:0}.mini label{white-space:nowrap}
small{color:var(--mu)}
/* প্রিন্ট শিট */
.sw{margin:0 auto 18px;width:max-content}
.pl{font-size:12px;color:var(--mu);margin:0 0 4px}
.ps{background:#fff;color:#000;box-shadow:0 2px 12px #0004;overflow:hidden}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}.hd img{object-fit:contain}
.ttl{text-align:center;font-weight:700;font-size:1.5em;margin:.4em 0}
.bl{flex:1;min-width:18mm;border-bottom:1px dotted #000;align-self:flex-end;height:1em}.ir{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:.5em 0}.rule{border-top:1.5px solid #000;margin:.3em 0 .6em}
.st{display:flex;justify-content:space-between;font-weight:700;margin:.8em 0 .3em;border-bottom:1px solid #000}.st i{font-weight:400}
.q{display:flex;gap:.5em;margin:.45em 0;break-inside:avoid}.q>div{flex:1}.q .m{float:right;margin-left:1em}.cbk{break-before:column}
.op{display:grid;gap:.1em .8em;margin-top:.15em}.sb{margin-top:.15em}.sbl{display:flex;justify-content:space-between;gap:1em;margin-top:.25em}.sbl span:last-child{white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 .15em}.fr i{font-style:normal;border-bottom:1px solid #000;padding:0 .2em}.fr b{font-weight:400}
@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}.bar{grid-column:1}.panel{max-height:45vh}}
@media print{.bar,.panel,.pl,#ts{display:none!important}html,body,.app{height:auto;display:block;background:#fff}.pv{padding:0;overflow:visible}.sw{margin:0!important;width:auto;break-after:page}.sw:last-child{break-after:auto}.ps{box-shadow:none;zoom:1!important}*{-webkit-print-color-adjust:exact}}
</style><style id="pg"></style></head><body><div class="app">
<div class="bar"><b>📝 প্রশ্নপত্র নির্মাতা</b><span id="wn"></span><label>Zoom <input id="zm" type="number" value="80" min="30" max="200" step="10" style="width:64px">%</label><button class="p" onclick="print()">🖨 প্রিন্ট / PDF</button></div>
<div class="panel"><div class="tabs"><button data-t="st" class="on">⚙ সেটিংস</button><button data-t="qs">📝 প্রশ্ন</button><button data-t="io">📥 ইমপোর্ট/এক্সপোর্ট</button></div>
<div id="st"></div><div id="qs" hidden></div>
<div id="io" hidden><small>ছবি/টেক্সট চ্যাটে Claude-কে দিন, সে নিচের ফরম্যাটে JSON বানিয়ে দেবে; সেটা এখানে পেস্ট করে "যোগ করুন" চাপুন।<br>ফরম্যাট: [{"type":"mcq|short|long","q":"প্রশ্ন","o":["ক","খ","গ","ঘ"],"sub":["ক) ...","খ) ..."],"marks":"1"}]<br>গণিত: x^{2}, H_{2}O, ভগ্নাংশ F{h|2π}</small>
<textarea id="imp" rows="9" placeholder="JSON পেস্ট করুন"></textarea><div class="mini"><button class="p" id="addj">যোগ করুন</button><button id="expj">বর্তমান প্রশ্ন এক্সপোর্ট</button><button id="rst">সব রিসেট</button><button id="clr">শুধু প্রশ্ন মুছুন</button></div></div></div>
<div id="ts" style="display:none;position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;z-index:9;max-width:90%"></div><div class="pv"><div id="sheets"></div></div></div>
<script>
const BN=['Noto Serif Bengali','Noto Sans Bengali','Hind Siliguri','Anek Bangla','Atma','Baloo Da 2','Galada','Mina','Tiro Bangla','Nirmala UI','SolaimanLipi','Kalpurush','Siyam Rupali','Nikosh','NikoshBAN','AdorshoLipi','Mukti','Vrinda','Shonar Bangla','Lohit Bengali'],
EN=['Times New Roman','Arial','Georgia','Calibri','Cambria','Verdana','Tahoma','Segoe UI','Garamond','Book Antiqua','Courier New','Roboto','Open Sans','Lato','Montserrat','Poppins','Inter','Lora','Playfair Display','PT Serif','EB Garamond','Merriweather'];
const PS={A4:[210,297],Letter:[216,279],Legal:[216,356],A5:[148,210]};
const DEF={q1:0,q2:0,hdr2:0,
npp:'1',nc:1,nr:1,sp:'A4',so:'portrait',nm:5,ng:3,ncut:1,
npp2:'1',nc2:1,nr2:1,sp2:'A4',so2:'portrait',nm2:5,ng2:3,ncut2:1,
pc:1,cg:8,cr:0,paper:'A4',orient:'portrait',cw:210,ch:297,mt:12,mb:12,ml:15,mr:15,bn:'Noto Serif Bengali',bn2:'',en2:'',en:'Times New Roman',fs:12,lh:1.35,cols:2,lab:'bn',dig:1,hdr:1,logoPos:'left',textPos:'right',tfs:12,logoW:30,title:'Daily Exam',time:'৫ মিনিট',fm:'',date:'',subj:'',cls:'',
right:'পরিচালকঃ ইঞ্জি. আব্দুল্লাহ আল গালিব\nবি.এসসি. ইন সিভিল ইঞ্জিনিয়ারিং (কুয়েট)\nমোবাইল: ০১৫১৬৫৭৭৬৮১ | ০১৭৯১৩১৫৫২৩',
info:'নাম:|রোল:\nশ্রেণি: {class}|ব্যাচ:|সময়: {time}|পূর্ণমান: {marks}|প্রাপ্ত নম্বর:',logo:''};
const DS=[{type:'mcq',title:'বহুনির্বাচনি প্রশ্ন',note:'',marks:'',qs:[]}];
let S,K;try{K=JSON.parse(localStorage.getItem('qp')||'null')}catch(e){}
S=K&&K.s?{...DEF,...K.s}:{...DEF};let SC=K&&K.c?K.c:JSON.parse(JSON.stringify(DS));
const sv=()=>{try{localStorage.setItem('qp',JSON.stringify({s:S,c:SC}))}catch(e){}};
function msg(t){const e=document.getElementById('ts');e.textContent=t;e.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>e.style.display='none',4000)}
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const D=s=>S.dig==1?String(s).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]):s;
const fm=s=>esc(s).replace(/F\{([^|}]*)\|([^}]*)\}/g,'<span class=fr><i>$1</i><b>$2</b></span>').replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/_\{([^}]*)\}/g,'<sub>$1</sub>').replace(/\n/g,'<br>');
const LB=()=>S.lab=='a'?['a','b','c','d','e','f']:S.lab=='bn'?['ক','খ','গ','ঘ','ঙ','চ']:['A','B','C','D','E','F'];
const NPP=[...Array.from({length:16},(_,i)=>String(i+1)),'কাস্টম'];
const PR=(x,t)=>[['npp'+x,'🖨 '+t+': এক শিটে কত কপি','sel',NPP],['nc'+x,t+' কাস্টম: কলাম সংখ্যা','num'],['nr'+x,t+' কাস্টম: সারি সংখ্যা','num'],['sp'+x,t+': প্রিন্ট শিটের সাইজ','sel',Object.keys(PS)],['so'+x,t+': শিটের দিক','sel',['portrait','landscape']],['nm'+x,t+': শিটের মার্জিন (mm)','num'],['ng'+x,t+': কপির মাঝের ফাঁক (mm)','num'],['ncut'+x,t+': কাটার দাগ (১/০)','sel',[1,0]]];
const CFG=[['_a','📄 পাতা ও মার্জিন','h'],['paper','কাগজের সাইজ','sel',[...Object.keys(PS),'Custom']],['orient','পাতার দিক (portrait=লম্বা, landscape=আড়াআড়ি)','sel',['portrait','landscape']],['cw','কাস্টম প্রস্থ (mm)','num'],['ch','কাস্টম উচ্চতা (mm)','num'],['mt','উপরের মার্জিন (mm)','num'],['mb','নিচের মার্জিন (mm)','num'],['ml','বাম মার্জিন (mm)','num'],['mr','ডান মার্জিন (mm)','num'],
['_b','🔤 ফন্ট ও লেখা','h'],['bn','বাংলা ফন্ট (তালিকা)','sel',BN],['bn2','বাংলা কাস্টম ফন্ট (লিখলে এটাই চলবে)','txt'],['en','ইংরেজি ফন্ট (তালিকা)','sel',EN],['en2','ইংরেজি কাস্টম ফন্ট (লিখলে এটাই চলবে)','txt'],['fs','ফন্ট সাইজ (pt)','num'],['lh','লাইন স্পেসিং','num'],['dig','বাংলা সংখ্যা (১/০)','sel',[1,0]],['lab','অপশন লেবেল (bn=ক খ, en=A B, a=a b)','sel',['bn','en','a']],
['_c','🏫 হেডার ও লোগো','h'],['hdr','১ম পাতায় হেডার দেখাও (১/০)','sel',[1,0]],['logo','লোগো আপলোড','file'],['logoPos','লোগোর অবস্থান','sel',['left','center','right']],['logoW','লোগোর প্রস্থ (mm)','num'],['textPos','প্রতিষ্ঠানের নাম/টেক্সটের অবস্থান','sel',['left','center','right']],['tfs','হেডার টেক্সটের সাইজ (pt)','num'],['right','প্রতিষ্ঠানের নাম/হেডার টেক্সট (প্রতি লাইনে একটি)','ta'],['title','পরীক্ষার শিরোনাম','txt'],['info','তথ্য ঘর (লাইন = সারি, | = আলাদা ঘর; {time} {marks} {subject} {class} {date})','ta'],
['_d','🗓 পরীক্ষার তথ্য','h'],['time','পরীক্ষার সময় → {time}','txt'],['fm','পূর্ণমান (ফাঁকা = স্বয়ংক্রিয় যোগফল) → {marks}','txt'],['subj','বিষয় → {subject}','txt'],['cls','শ্রেণি → {class}','txt'],['date','তারিখ → {date}','txt'],
['_e','▦ কলাম ও অপশন','h'],['pc','পাতার ডিফল্ট কলাম সংখ্যা','sel',[1,2,3,4]],['cg','কলামের ফাঁক (mm)','num'],['cr','কলামের মাঝে দাগ (১/০)','sel',[0,1]],['cols','MCQ অপশন কলাম','sel',[1,2,3,4]],
['_f','📑 পাতা ভাগ','h'],['q1','১ম পাতায় প্রশ্ন সংখ্যা (০ = ম্যানুয়াল/সব)','num'],['q2','পরবর্তী প্রতি পাতায় প্রশ্ন সংখ্যা (০ = সব বাকি)','num'],['hdr2','পরবর্তী পাতার হেডার (০=নেই, ১=পূর্ণ, ২=শুধু শিরোনাম+তথ্য ঘর)','sel',[0,1,2]],
['_g','🖨 প্রিন্ট: ১ম পাতা','h'],...PR('','১ম পাতা'),['_h','🖨 প্রিন্ট: পরবর্তী পাতাগুলো','h'],...PR('2','পরবর্তী পাতা')];
const M={1:[1,1,'portrait'],2:[2,1,'landscape'],3:[3,1,'landscape'],4:[2,2,'portrait'],5:[3,2,'landscape'],6:[3,2,'landscape'],7:[4,2,'landscape'],8:[4,2,'landscape'],9:[3,3,'portrait'],10:[5,2,'landscape'],11:[4,3,'landscape'],12:[3,4,'portrait'],13:[5,3,'landscape'],14:[5,3,'landscape'],15:[5,3,'landscape'],16:[4,4,'portrait']};
function rs(){let fg=0;$('st').innerHTML=PB()+CFG.map(([k,l,t,o])=>{const v=esc(S[k]);let c;
if(t=='h')return(fg++?'</details>':'')+`<details class=g${fg==1?' open':''}><summary>${l}</summary>`;
if(t=='sel')c=`<select data-k=${k}>${o.map(x=>`<option ${x==S[k]?'selected':''} ${k=='bn'||k=='en'?`style="font-family:'${x}'"`:''}>${x}</option>`).join('')}</select>`;
else if(t=='ta')return`<div><small>${l}</small><textarea data-k=${k} rows=4>${v}</textarea></div>`;
else if(t=='file')c=`<span><input type=file accept="image/*" id=lg style="width:100%"><button id=lgx>মুছুন</button></span>`;
else c=`<input data-k=${k} type=${t=='num'?'number':'text'} step=any value="${v}">`;
return`<div class=row><label>${l}</label>${c}</div>`}).join('')+'</details>'}
$('st').oninput=e=>{const k=e.target.dataset.k;if(!k||k=='_')return;S[k]=e.target.type=='number'?+e.target.value:e.target.value;const m=k.match(/^npp(2?)$/);if(m&&M[S[k]]){const x=m[1];[S['nc'+x],S['nr'+x],S['so'+x]]=M[S[k]];sv();rs();pv();return}sv();pv()};
$('st').onchange=e=>{if(e.target.id!='lg')return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.logo=r.result;sv();pv()};r.readAsDataURL(f)};
const PK=['bn2','en2','pc','cg','cr','orient','right','title','info','logo','logoPos','logoW','textPos','tfs','hdr','hdr2','bn','en','fs','lh','paper','cw','ch','mt','mb','ml','mr','cols','lab','dig'];
const gp=()=>{try{return JSON.parse(localStorage.getItem('qpp')||'{}')}catch(e){return{}}};
function PB(){const P=gp();return`<div class=card><small>🏫 প্রতিষ্ঠান প্রোফাইল (হেডার, লোগো, ফন্ট, মার্জিন সংরক্ষণ)</small><div class=mini><select id=pl data-k=_>${Object.keys(P).map(n=>`<option>${esc(n)}</option>`).join('')}</select><button id=pload>লোড</button><button id=pdel>মুছুন</button></div><div class=mini><input id=pn data-k=_ placeholder="নতুন প্রোফাইলের নাম"><button id=psave class=p>সংরক্ষণ</button></div></div>`}
$('st').onclick=e=>{const i=e.target.id,P=gp();if(i=='lgx'){S.logo='';sv();pv()}
else if(i=='psave'){const n=$('pn').value.trim();if(!n)return msg('নাম দিন');P[n]={};PK.forEach(k=>P[n][k]=S[k]);try{localStorage.setItem('qpp',JSON.stringify(P))}catch(x){msg('জায়গা শেষ, ছোট লোগো দিন')}rs()}
else if(i=='pload'){const n=$('pl').value;if(P[n]){Object.assign(S,P[n]);sv();rs();pv()}}
else if(i=='pdel'){delete P[$('pl').value];try{localStorage.setItem('qpp',JSON.stringify(P))}catch(x){}rs()}};
document.querySelector('.tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;['st','qs','io'].forEach(x=>$(x).hidden=x!=t);[...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b.dataset.t==t))};

/* প্রিন্ট গ্রুপ সেটিং (x = '' → ১ম পাতা, '2' → পরবর্তী) */
const gc=x=>{const nc=Math.max(1,+S['nc'+x]||1),nr=Math.max(1,+S['nr'+x]||1);let n=parseInt(S['npp'+x])||nc*nr;n=Math.max(1,Math.min(n,nc*nr));return{nc,nr,n,sp:S['sp'+x],so:S['so'+x],nm:+S['nm'+x]||0,ng:+S['ng'+x]||0,cut:S['ncut'+x]==1}};

/* প্রশ্ন সংখ্যা ও ম্যানুয়াল ব্রেক অনুযায়ী পাতা ভাগ */
function paginate(){const K1=+S.q1||0,K2=+S.q2||0,P=[[]];let cnt=0;
SC.forEach(s=>{let cur=null;const last=()=>P[P.length-1],np=()=>{P.push([]);cnt=0;cur=null};
if(s.pb&&last().length)np();
if(!s.qs.length){last().push({s,i0:0,qs:[],head:true});return}
s.qs.forEach((q,i)=>{const lim=P.length==1?K1:K2;if(last().length&&(q.pb||(lim&&cnt>=lim)))np();
if(!cur){cur={s,i0:i,qs:[],head:i==0};last().push(cur)}cur.qs.push(q);cnt++})});
return P}

function pv(){let[w,h]=S.paper=='Custom'?[S.cw,S.ch]:PS[S.paper];if(S.orient=='landscape')[w,h]=[h,w];
const css=`width:${w}mm;height:${h}mm;padding:${S.mt}mm ${S.mr}mm ${S.mb}mm ${S.ml}mm;font:${S.fs}pt/${S.lh} "${S.en2||S.en}","${S.bn2||S.bn}",serif;overflow:hidden;background:#fff;color:#000`;
const EN2=x=>String(x).replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)),rd=x=>Math.round(x*100)/100;
const stt=s=>{const m=s.qs.map(q=>parseFloat(EN2(q.marks||s.pm||0))||0),n=Math.min(+EN2(s.req||0)||s.qs.length,s.qs.length);return[n,m.length?rd(m.reduce((a,b)=>a+b,0)/m.length*n):0]};
const auto=s=>{const[n,t]=stt(s);return t?(s.pm?`${s.pm}×${n}=${t}`:`${t}`):''};
const TOT=rd(SC.reduce((a,s)=>a+stt(s)[1],0)),tk=x=>x.replace(/\{time\}/g,S.time).replace(/\{marks\}/g,S.fm||D(TOT)).replace(/\{date\}/g,S.date).replace(/\{subject\}/g,S.subj).replace(/\{class\}/g,S.cls);
const L=LB();
/* হেডার অংশ */
const lg=S.logo?`<img src="${S.logo}" style="width:${S.logoW}mm">`:'',tx=`<div style="font-size:${S.tfs}pt">${fm(tk(S.right))}</div>`;
const cell=a=>`<div style="display:flex;flex-direction:column;gap:4px;align-items:${a=='left'?'flex-start':a=='right'?'flex-end':'center'};text-align:${a}">${S.logoPos==a?lg:''}${S.textPos==a?tx:''}</div>`;
const ttlH=`<div class=ttl>${fm(tk(S.title))}</div>`;
const infoH=tk(S.info).split('\n').filter(x=>x.trim()).map(r=>`<div class=ir>${r.split('|').map(c=>{const i=c.indexOf(':');const v=c.slice(i+1).trim();return`<span style="display:flex;gap:4px;flex:${v?'none':1}"><b>${esc(c.slice(0,i+1))}</b>${v?esc(v):'<i class=bl></i>'}</span>`}).join('')}</div>`).join('')+'<div class=rule></div>';
const hdFull=`<div class=hd style="display:grid;grid-template-columns:1fr auto 1fr">${cell('left')}${cell('center')}${cell('right')}</div>`+ttlH+infoH,hdMini=ttlH+infoH;
/* সেকশন-ব্লক */
const blk=b=>{const s=b.s;let o='';
if(b.head)o+=`<div class=st><span>${fm(s.title)} <i>${fm(s.note)}</i></span><span>${D(esc(s.marks||auto(s)))}</span></div>`;
if(b.qs.length){const nc=+s.sc||+S.pc||1;o+=`<div style="column-count:${nc};column-gap:${S.cg}mm;${S.cr==1&&nc>1?'column-rule:1px solid #000':''}">`;
b.qs.forEach((q,j)=>{const m=q.marks?`<span class=m>[${D(esc(q.marks))}]</span>`:'';
o+=`<div class="q${q.cb?' cbk':''}"><span>${D(b.i0+j+1)}.</span><div>${m}${fm(q.q)}${q.img?`<div style="text-align:center;margin:.4em 0"><img src="${q.img}" style="width:${q.iw||70}mm;max-width:100%"></div>`:''}`;
if(s.type=='mcq')o+=`<div class=op style="grid-template-columns:repeat(${(+q.oc||Math.max(1,Math.floor(S.cols/nc)))},1fr)">${(q.o||[]).map((x,k)=>`<span>(${L[k]||k+1}) ${fm(x)}</span>`).join('')}</div>`;
else if(q.sub)o+=`<div class=sb>${q.sub.split('\n').filter(x=>x.trim()).map(l=>{const k=l.lastIndexOf('|'),ok=k>-1&&!l.slice(k+1).includes('}');return`<div class=sbl><span>${fm(ok?l.slice(0,k):l)}</span><span>${ok?D(esc(l.slice(k+1).trim())):''}</span></div>`}).join('')}</div>`;o+='</div></div>'});o+='</div>'}
return o};
const pages=paginate();
const sz=x=>{const g=gc(x);if(g.n==1)return[w,h];let[a,b]=PS[g.sp]||PS.A4;if(g.so=='landscape')[a,b]=[b,a];return[a,b]};
const z=($('zm').value||80)/100;
const out=pages.map((bl,pi)=>{const x=pi?'2':'',g=gc(x),[SW,SH0]=sz(x),SH=SH0-.5;
let hd=pi==0?(S.hdr==1?hdFull:''):(S.hdr2==1?hdFull:S.hdr2==2?hdMini:'');
const html=hd+bl.map(blk).join('');
let inner;
if(g.n==1)inner=`<div class=ps style="width:${SW}mm;height:${SH}mm;zoom:${z}"><div class=pgc style='${css};height:${SH}mm'>${html}</div></div>`;
else{const cw=(SW-2*g.nm-(g.nc-1)*g.ng)/g.nc,ch=(SH-2*g.nm-(g.nr-1)*g.ng)/g.nr,k=Math.min(cw/w,ch/h);
const c1=`<div style="width:${cw}mm;height:${ch}mm;overflow:hidden;${g.cut?'outline:1px dashed #999;':''}"><div class=pgc style='${css};transform:scale(${k});transform-origin:0 0'>${html}</div></div>`;
inner=`<div class=ps style="width:${SW}mm;height:${SH}mm;padding:${g.nm}mm;zoom:${z}"><div style="display:grid;grid-template-columns:repeat(${g.nc},${cw}mm);grid-auto-rows:${ch}mm;gap:${g.ng}mm;align-content:start">${c1.repeat(g.n)}</div></div>`}
const lab=`পাতা ${D(pi+1)} / ${D(pages.length)} — প্রতি শিটে ${D(g.n)} কপি`;
return`<div class="sw pg${pi?2:1}"><div class=pl>${lab}</div>${inner}</div>`}).join('');
const s1=sz(''),s2=sz('2');
$('pg').textContent=`@page{size:${s1[0]}mm ${s1[1]}mm;margin:0}@page p1{size:${s1[0]}mm ${s1[1]}mm;margin:0}@page p2{size:${s2[0]}mm ${s2[1]}mm;margin:0}.pg1{page:p1}.pg2{page:p2}`;
$('sheets').innerHTML=out;
const bad=[];document.querySelectorAll('#sheets .sw').forEach((p,i)=>{const e=p.querySelector('.pgc');if(e&&e.scrollHeight>e.clientHeight+2)bad.push(D(i+1))});
$('wn').textContent=bad.length?`⚠ পাতা ${bad.join(', ')} ভরে গেছে — প্রশ্ন সংখ্যা কমান`:''}
function ed(){$('qs').innerHTML=SC.map((s,i)=>`<div class=card><div class=mini><select data-s=${i} data-f=type>${['mcq','short','long'].map(t=>`<option ${t==s.type?'selected':''}>${t}</option>`).join('')}</select><input data-s=${i} data-f=title value="${esc(s.title)}"><button data-a=ds data-s=${i}>✕ সেকশন</button></div>
<div class=mini><input data-s=${i} data-f=note placeholder="নির্দেশনা" value="${esc(s.note)}"><input data-s=${i} data-f=marks placeholder="নম্বর (ফাঁকা=স্বয়ংক্রিয়)" value="${esc(s.marks)}"><label><input type=checkbox data-s=${i} data-f=pb ${s.pb?'checked':''}> নতুন পাতা</label></div>
<div class=mini><input data-s=${i} data-f=pm placeholder="প্রতি প্রশ্নে নম্বর" value="${esc(s.pm)}"><input data-s=${i} data-f=req placeholder="কয়টির উত্তর (ফাঁকা=সব)" value="${esc(s.req)}"><select data-s=${i} data-f=sc><option value="">কলাম: ডিফল্ট</option>${[1,2,3,4].map(n=>`<option value=${n} ${s.sc==n?'selected':''}>কলাম: ${n}</option>`).join('')}</select></div>
${s.qs.map((q,j)=>`<div class=q style="display:block"><textarea rows=2 data-s=${i} data-q=${j} data-f=q>${esc(q.q)}</textarea>
${s.type=='mcq'?`<div class=mini>${(q.o||[]).map((o,k)=>`<input data-s=${i} data-q=${j} data-o=${k} value="${esc(o)}" placeholder="অপশন ${k+1}">`).join('')}<button data-a=ao data-s=${i} data-q=${j}>+</button><button data-a=do data-s=${i} data-q=${j}>−</button><input data-s=${i} data-q=${j} data-f=oc placeholder="অপশন কলাম" value="${esc(q.oc)}" style="max-width:90px"></div>`:s.type=='long'?`<textarea rows=3 data-s=${i} data-q=${j} data-f=sub placeholder="উপপ্রশ্ন, প্রতি লাইনে একটি। নম্বর শেষে |৩ লিখুন, যেমন: ক. অরবিটাল কাকে বলে?|১">${esc(q.sub)}</textarea>`:''}
<div class=mini><label>🖼 ছবি: <input type=file accept="image/*" data-a=img data-s=${i} data-q=${j} style="max-width:150px"></label><input data-s=${i} data-q=${j} data-f=iw placeholder="ছবির প্রস্থ mm" value="${esc(q.iw)}" style="max-width:110px">${q.img?`<button data-a=rimg data-s=${i} data-q=${j}>ছবি মুছুন ✓</button>`:''}</div>
<div class=mini><input data-s=${i} data-q=${j} data-f=marks placeholder="নম্বর" value="${esc(q.marks)}" style="max-width:80px"><label><input type=checkbox data-s=${i} data-q=${j} data-f=pb ${q.pb?'checked':''}> নতুন পাতা</label><label><input type=checkbox data-s=${i} data-q=${j} data-f=cb ${q.cb?'checked':''}> নতুন কলাম</label><button data-a=up data-s=${i} data-q=${j}>↑</button><button data-a=dn data-s=${i} data-q=${j}>↓</button><button data-a=dq data-s=${i} data-q=${j}>🗑</button></div></div>`).join('')}
<button data-a=aq data-s=${i}>+ প্রশ্ন যোগ</button></div>`).join('')+`<div class=mini>${[['mcq','MCQ'],['short','সংক্ষিপ্ত'],['long','বড়/সৃজনশীল']].map(([t,l])=>`<button class=p data-a=as data-t=${t}>+ ${l} সেকশন</button>`).join('')}</div>`}
$('qs').oninput=e=>{const d=e.target.dataset;if(d.f==null&&d.o==null)return;const s=SC[d.s],t=e.target,v=t.type=='checkbox'?(t.checked?1:''):t.value;if(d.q==null)s[d.f]=v;else{const q=s.qs[d.q];d.o!=null?q.o[d.o]=v:q[d.f]=v}sv();pv()};
$('qs').onchange=e=>{const t=e.target;if(t.dataset.a=='img'&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);SC[t.dataset.s].qs[t.dataset.q].img=c.toDataURL('image/jpeg',.85);sv();ed();pv();msg('ছবি যোগ হয়েছে')};im.src=r.result};r.readAsDataURL(t.files[0]);return}
if(e.target.dataset.f=='type'){const s=SC[e.target.dataset.s];s.type=e.target.value;s.qs.forEach(q=>{if(s.type=='mcq'&&!q.o)q.o=['','','','']});sv();ed();pv()}};
$('qs').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,s=SC[d.s],a=d.a,q=s&&s.qs[d.q];
if(a=='as')SC.push({type:d.t,title:'নতুন সেকশন',note:'',marks:'',qs:[]});else if(a=='ds'){SC.splice(d.s,1)}
else if(a=='aq')s.qs.push({q:'',marks:'',...(s.type=='mcq'?{o:['','','','']}:{sub:''})});else if(a=='dq')s.qs.splice(d.q,1);
else if(a=='rimg'){delete q.img}else if(a=='ao')q.o.push('');else if(a=='do')q.o.pop();
else if(a=='up'&&d.q>0)[s.qs[d.q-1],s.qs[d.q]]=[s.qs[d.q],s.qs[d.q-1]];else if(a=='dn'&&+d.q<s.qs.length-1)[s.qs[+d.q+1],s.qs[d.q]]=[s.qs[d.q],s.qs[+d.q+1]];
sv();ed();pv()};
$('addj').onclick=()=>{try{let a=JSON.parse($('imp').value);if(!Array.isArray(a))a=a.questions||[a];a.forEach(x=>{const t=x.type||(x.o?'mcq':'short');let s=SC.find(z=>z.type==t);if(!s){s={type:t,title:t=='mcq'?'বহুনির্বাচনি প্রশ্ন':t=='long'?'সৃজনশীল প্রশ্ন':'সংক্ষিপ্ত প্রশ্ন',note:'',marks:'',qs:[]};SC.push(s)}
const sub=Array.isArray(x.sub)?x.sub.join('\n'):x.sub;s.qs.push({q:x.q||'',marks:x.marks||'',...(x.oc?{oc:x.oc}:{}),...(x.iw?{iw:x.iw}:{}),...(t=='mcq'?{o:x.o||['','','','']}:{sub:sub||''})})});$('imp').value='';sv();ed();pv();msg(a.length+'টি প্রশ্ন যোগ হয়েছে')}catch(e){msg('JSON ঠিক নেই: '+e.message)}};
$('expj').onclick=()=>{const t=JSON.stringify(SC.flatMap(s=>s.qs.map(q=>({type:s.type,...q}))),null,1);$('imp').value=t;$('imp').select();try{navigator.clipboard.writeText(t).catch(()=>{})}catch(e){}msg('এক্সপোর্ট হয়েছে — উপরের বক্সে কপি করার জন্য নির্বাচিত')};
