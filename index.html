<style>

n,input,select,textarea{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:5px 8px}\nbutton{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}\ntextarea{width:100%;resize:vertical}input,select{max-width:100%}\n.tabs{display:flex;gap:4px;margin-bottom:10px}.tabs button{flex:1}.tabs .on{background:var(--ac);color:#fff}\n.row{display:grid;grid-template-columns:1fr 1.2fr;gap:6px;align-items:center;margin:5px 0}.row label{color:var(--mu)}\ndetails.g{border:1px solid var(--bd);border-radius:10px;margin:8px 0;overflow:hidden}details.g summary{cursor:pointer;padding:9px 12px;font-weight:700;background:var(--bg);list-style:none}details.g[open] summary{border-bottom:1px solid var(--bd)}details.g>div{padding:0 12px}details.g>div:last-child{padding-bottom:8px}.hint{color:var(--mu);font-size:12px;margin:4px 0 8px}\n.card{border:1px solid var(--bd);border-radius:8px;padding:8px;margin:8px 0}.card .q{border-top:1px dashed var(--bd);margin-top:8px;padding-top:8px}\n.mini{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}.mini input{flex:1;min-width:70px}.mini input[type=checkbox]{flex:none;min-width:0}.mini label{white-space:nowrap}\nsmall{color:var(--mu)}\n/* প্রিন্ট শিট */\n.sw{margin:0 auto 18px;width:max-content}\n.pl{font-size:12px;color:var(--mu);margin:0 0 4px}\n.ps{background:#fff;color:#000;box-shadow:0 2px 12px #0004;overflow:hidden}\n.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}.hd img{object-fit:contain}\n.ttl{text-align:center;font-weight:700;font-size:1.5em;margin:.4em 0}\n.bl{flex:1;min-width:18mm;border-bottom:1px dotted #000;align-self:flex-end;height:1em}.ir{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:.5em 0}.rule{border-top:1.5px solid #000;margin:.3em 0 .6em}\n.st{display:flex;justify-content:space-between;font-weight:700;margin:.8em 0 .3em;border-bottom:1px solid #000}.st i{font-weight:400}\n.q{display:flex;gap:.5em;margin:.45em 0;break-inside:avoid}.q>div{flex:1}.q .m{float:right;margin-left:1em}.cbk{break-before:column}\n.op{display:grid;gap:.1em .8em;margin-top:.15em}.sb{margin-top:.15em}.sbl{display:flex;justify-content:space-between;gap:1em;margin-top:.25em}.sbl span:last-child{white-space:nowrap}\n.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 .15em}.fr i{font-style:normal;border-bottom:1px solid #000;padding:0 .2em}.fr b{font-weight:400}\n@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}.bar{grid-column:1}.panel{max-height:45vh}}\n@media print{.bar,.panel,.pl,#ts{display:none!important}html,body,.app{height:auto;display:block;background:#fff}.pv{padding:0;overflow:visible}.sw{margin:0!important;width:auto;break-after:page}.sw:last-child{break-after:auto}.ps{box-shadow:none;zoom:1!important}*{-webkit-print-color-adjust:exact}}\n.pres{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 0}.pres button{text-align:left;font-weight:600}.lay{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}.lay .bdr{position:absolute}.lay .wm{position:absolute;left:50%;top:50%;white-space:nowrap;font-weight:700;color:var(--acc)}.ttl{color:var(--acc)}.rule{border-color:var(--acc)}<\/style><style id=\"pg\"><\/style><\/head><body><div class=\"app\">\n<div class=\"bar\"><b>📝 প্রশ্নপত্র নির্মাতা<\/b><span id=\"wn\"><\/span><label>Zoom <input id=\"zm\" type=\"number\" value=\"80\" min=\"30\" max=\"200\" step=\"10\" style=\"width:64px\">%<\/label><button class=\"p\" onclick=\"print()\">🖨 প্রিন্ট / PDF<\/button><\/div>\n<div class=\"panel\"><div class=\"tabs\"><button data-t=\"st\" class=\"on\">⚙ সেটিংস<\/button><button data-t=\"qs\">📝 প্রশ্ন<\/button><button data-t=\"io\">📥 ইমপোর্ট/এক্সপোর্ট<\/button><\/div>\n<div id=\"st\"><\/div><div id=\"qs\" hidden><\/div>\n<div id=\"io\" hidden><small>ছবি/টেক্সট চ্যাটে Claude-কে দিন, সে নিচের ফরম্যাটে JSON বানিয়ে দেবে; সেটা এখানে পেস্ট করে \"যোগ করুন\" চাপুন।<br>ফরম্যাট: [{\"type\":\"mcq|short|long\",\"q\":\"প্রশ্ন\",\"o\":[\"ক\",\"খ\",\"গ\",\"ঘ\"],\"sub\":[\"ক) ...\",\"খ) ...\"],\"marks\":\"1\"}]<br>গণিত: x^{2}, H_{2}O, ভগ্নাংশ F{h|2π}<\/small>\n<textarea id=\"imp\" rows=\"9\" placeholder=\"JSON পেস্ট করুন\"><\/textarea><div class=\"mini\"><button class=\"p\" id=\"addj\">যোগ করুন<\/button><button id=\"expj\">বর্তমান প্রশ্ন এক্সপোর্ট<\/button><button id=\"rst\">সব রিসেট<\/button><button id=\"clr\">শুধু প্রশ্ন মুছুন<\/button><\/div><\/div><\/div>\n<div id=\"ts\" style=\"display:none;position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;z-index:9;max-width:90%\"><\/div><div class=\"pv\"><div id=\"sheets\"><\/div><\/div><\/div>\n<script>\nconst BN=['Noto Serif Bengali','Noto Sans Bengali','Hind Siliguri','Anek Bangla','Atma','Baloo Da 2','Galada','Mina','Tiro Bangla','Nirmala UI','SolaimanLipi','Kalpurush','Siyam Rupali','Nikosh','NikoshBAN','AdorshoLipi','Mukti','Vrinda','Shonar Bangla','Lohit Bengali'],\nEN=['Times New Roman','Arial','Georgia','Calibri','Cambria','Verdana','Tahoma','Segoe UI','Garamond','Book Antiqua','Courier New','Roboto','Open Sans','Lato','Montserrat','Poppins','Inter','Lora','Playfair Display','PT Serif','EB Garamond','Merriweather'];\nconst PS={A4:[210,297],Letter:[216,279],Legal:[216,356],A5:[148,210]};\nconst DEF={ac:'#111111',wm:'off',wmt:'',wms:56,wmw:100,wma:-30,wmo:7,bt:'none',bc:'#111111',bw:1.5,bi:5,q1:0,q2:0,hdr2:0,\nnpp:'1',nc:1,nr:1,sp:'A4',so:'portrait',nm:5,ng:3,ncut:1,\nnpp2:'1',nc2:1,nr2:1,sp2:'A4',so2:'portrait',nm2:5,ng2:3,ncut2:1,\npc:1,cg:8,cr:0,paper:'A4',orient:'portrait',cw:210,ch:297,mt:12,mb:12,ml:15,mr:15,bn:'Noto Serif Bengali',bn2:'',en2:'',en:'Times New Roman',fs:12,lh:1.35,cols:2,lab:'bn',dig:1,hdr:1,logoPos:'left',textPos:'right',tfs:12,logoW:30,title:'Daily Exam',time:'৫ মিনিট',fm:'',date:'',subj:'',cls:'',\nright:'পরিচালকঃ ইঞ্জি. আব্দুল্লাহ আল গালিব\\nবি.এসসি. ইন সিভিল ইঞ্জিনিয়ারিং (কুয়েট)\\nমোবাইল: ০১৫১৬৫৭৭৬৮১ | ০১৭৯১৩১৫৫২৩',\ninfo:'নাম:|রোল:\\nশ্রেণি: {class}|ব্যাচ:|সময়: {time}|পূর্ণমান: {marks}|প্রাপ্ত নম্বর:',logo:''};\nconst DS=[{type:'mcq',title:'বহুনির্বাচনি প্রশ্ন',note:'',marks:'',qs:[]}];\nlet S,K;try{K=JSON.parse(localStorage.getItem('qp')||'null')}catch(e){}\nS=K&&K.s?{...DEF,...K.s}:{...DEF};let SC=K&&K.c?K.c:JSON.parse(JSON.stringify(DS));\nconst sv=()=>{try{localStorage.setItem('qp',JSON.stringify({s:S,c:SC}))}catch(e){}try{parent!==window&&parent.postMessage({t:'change',s:S,c:SC},'*')}catch(e){}};\nfunction msg(t){const e=document.getElementById('ts');e.textContent=t;e.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>e.style.display='none',4000)}\nconst $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/\"/g,'&quot;');\nconst D=s=>S.dig==1?String(s).replace(/\\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]):s;\nconst fm=s=>esc(s).replace(/F\\{([^|}]*)\\|([^}]*)\\}/g,'<span class=fr><i>$1<\/i><b>$2<\/b><\/span>').replace(/\\^\\{([^}]*)\\}/g,'<sup>$1<\/sup>').replace(/_\\{([^}]*)\\}/g,'<sub>$1<\/sub>').replace(/\\n/g,'<br>');\nconst LB=()=>S.lab=='a'?['a','b','c','d','e','f']:S.lab=='bn'?['ক','খ','গ','ঘ','ঙ','চ']:['A','B','C','D','E','F'];\nconst NPP=[...Array.from({length:16},(_,i)=>String(i+1)),'কাস্টম'];\nconst PR=(x,t)=>[['npp'+x,'🖨 '+t+': এক শিটে কত কপি','sel',NPP],['nc'+x,t+' কাস্টম: কলাম সংখ্যা','num'],['nr'+x,t+' কাস্টম: সারি সংখ্যা','num'],['sp'+x,t+': প্রিন্ট শিটের সাইজ','sel',Object.keys(PS)],['so'+x,t+': শিটের দিক','sel',['portrait','landscape']],['nm'+x,t+': শিটের মার্জিন (mm)','num'],['ng'+x,t+': কপির মাঝের ফাঁক (mm)','num'],['ncut'+x,t+': কাটার দাগ (১/০)','sel',[1,0]]];\nconst PRE=[{n:'ক্লাসিক নীল',c:'#1d4ed8',v:{ac:'#1d4ed8',bc:'#1d4ed8',hs:'band',bt:'single',bn:'Noto Serif Bengali',en:'Times New Roman'}},{n:'পান্না সবুজ',c:'#047857',v:{ac:'#047857',bc:'#047857',hs:'band',bt:'single',bn:'Hind Siliguri',en:'Open Sans'}},{n:'রাজকীয় মেরুন',c:'#7f1d1d',v:{ac:'#7f1d1d',bc:'#7f1d1d',hs:'classic',bt:'double',bn:'Noto Serif Bengali',en:'Georgia'}},{n:'গাঢ় বেগুনি',c:'#6d28d9',v:{ac:'#6d28d9',bc:'#6d28d9',hs:'band',bt:'single',bn:'Anek Bangla',en:'Poppins'}},{n:'কালো-সাদা',c:'#111111',v:{ac:'#111111',bc:'#111111',hs:'classic',bt:'single',bn:'Noto Sans Bengali',en:'Arial'}},{n:'কমলা',c:'#c2410c',v:{ac:'#c2410c',bc:'#c2410c',hs:'band',bt:'none',bn:'Baloo Da 2',en:'Montserrat'}},{n:'সমুদ্র নীল',c:'#0e7490',v:{ac:'#0e7490',bc:'#0e7490',hs:'classic',bt:'single',bn:'Noto Sans Bengali',en:'Inter'}},{n:'ঐতিহ্য',c:'#92400e',v:{ac:'#92400e',bc:'#92400e',hs:'classic',bt:'double',bn:'Tiro Bangla',en:'Playfair Display'}}];\nconst CFG=[['_p','🎨 ডিজাইন প্রিসেট (এক ক্লিকে রং, ফন্ট, স্টাইল)','h'],['_pre','','pre'],['_c2','💧 জলছাপ ও বর্ডার','h'],['ac','থিম রং','col'],['wm','জলছাপ','sel',['off','text','logo']],['wmt','জলছাপের লেখা (ফাঁকা = প্রতিষ্ঠানের নাম)','txt'],['wms','লেখার সাইজ (pt)','num'],['wmw','লোগো জলছাপের প্রস্থ (mm)','num'],['wma','ঘূর্ণন (ডিগ্রি)','num'],['wmo','গাঢ়তা (%)','num'],['bt','পাতার বর্ডার','sel',['none','single','double']],['bc','বর্ডারের রং','col'],['bw','বর্ডারের মোটা (px)','num'],['bi','কিনারা থেকে দূরত্ব (mm)','num'],\n['_a','📄 পাতা ও মার্জিন','h'],['paper','কাগজের সাইজ','sel',[...Object.keys(PS),'Custom']],['orient','পাতার দিক (portrait=লম্বা, landscape=আড়াআড়ি)','sel',['portrait','landscape']],['cw','কাস্টম প্রস্থ (mm)','num'],['ch','কাস্টম উচ্চতা (mm)','num'],['mt','উপরের মার্জিন (mm)','num'],['mb','নিচের মার্জিন (mm)','num'],['ml','বাম মার্জিন (mm)','num'],['mr','ডান মার্জিন (mm)','num'],\n['_b','🔤 ফন্ট ও লেখা','h'],['bn','বাংলা ফন্ট (তালিকা)','sel',BN],['bn2','বাংলা কাস্টম ফন্ট (লিখলে এটাই চলবে)','txt'],['en','ইংরেজি ফন্ট (তালিকা)','sel',EN],['en2','ইংরেজি কাস্টম ফন্ট (লিখলে এটাই চলবে)','txt'],['fs','ফন্ট সাইজ (pt)','num'],['lh','লাইন স্পেসিং','num'],['dig','বাংলা সংখ্যা (১/০)','sel',[1,0]],['lab','অপশন লেবেল (bn=ক খ, en=A B, a=a b)','sel',['bn','en','a']],\n['_c','🏫 হেডার ও লোগো','h'],['hdr','১ম পাতায় হেডার দেখাও (১/০)','sel',[1,0]],['logo','লোগো আপলোড','file'],['logoPos','লোগোর অবস্থান','sel',['left','center','right']],['logoW','লোগোর প্রস্থ (mm)','num'],['textPos','প্রতিষ্ঠানের নাম/টেক্সটের অবস্থান','sel',['left','center','right']],['tfs','হেডার টেক্সটের সাইজ (pt)','num'],['right','প্রতিষ্ঠানের নাম/হেডার টেক্সট (প্রতি লাইনে একটি)','ta'],['title','পরীক্ষার শিরোনাম','txt'],['info','তথ্য ঘর (লাইন = সারি, | = আলাদা ঘর; {time} {marks} {subject} {class} {date})','ta'],\n['_d','🗓 পরীক্ষার তথ্য','h'],['time','পরীক্ষার সময় → {time}','txt'],['fm','পূর্ণমান (ফাঁকা = স্বয়ংক্রিয় যোগফল) → {marks}','txt'],['subj','বিষয় → {subject}','txt'],['cls','শ্রেণি → {class}','txt'],['date','তারিখ → {date}','txt'],\n['_e','▦ কলাম ও অপশন','h'],['pc','পাতার ডিফল্ট কলাম সংখ্যা','sel',[1,2,3,4]],['cg','কলামের ফাঁক (mm)','num'],['cr','কলামের মাঝে দাগ (১/০)','sel',[0,1]],['cols','MCQ অপশন কলাম','sel',[1,2,3,4]],\n['_f','📑 পাতা ভাগ','h'],['q1','১ম পাতায় প্রশ্ন সংখ্যা (০ = ম্যানুয়াল/সব)','num'],['q2','পরবর্তী প্রতি পাতায় প্রশ্ন সংখ্যা (০ = সব বাকি)','num'],['hdr2','পরবর্তী পাতার হেডার (০=নেই, ১=পূর্ণ, ২=শুধু শিরোনাম+তথ্য ঘর)','sel',[0,1,2]],\n['_g','🖨 প্রিন্ট: ১ম পাতা','h'],...PR('','১ম পাতা'),['_h','🖨 প্রিন্ট: পরবর্তী পাতাগুলো','h'],...PR('2','পরবর্তী পাতা')];\nconst M={1:[1,1,'portrait'],2:[2,1,'landscape'],3:[3,1,'landscape'],4:[2,2,'portrait'],5:[3,2,'landscape'],6:[3,2,'landscape'],7:[4,2,'landscape'],8:[4,2,'landscape'],9:[3,3,'portrait'],10:[5,2,'landscape'],11:[4,3,'landscape'],12:[3,4,'portrait'],13:[5,3,'landscape'],14:[5,3,'landscape'],15:[5,3,'landscape'],16:[4,4,'portrait']};\nfunction rs(){let fg=0;$('st').innerHTML=CFG.map(([k,l,t,o])=>{const v=esc(S[k]);let c;\nif(t=='col')return`<div class=row><label>${l}<\/label><input data-k=${k} type=color value=\"${v}\"><\/div>`;if(t=='pre')return`<div class=pres>${PRE.map((p,i)=>`<button data-pre=${i} style=\"border-left:10px solid ${p.c}\">${p.n}<\/button>`).join('')}<\/div>`;if(t=='h')retur
