S.wms}pt\">${S.wm=='text'?fm(S.wmt||S.inst):(S.logo?`<img src=\"${S.logo}\" style=\"width:${S.wmw}mm\">`:'')}<\/div>`;\nconst brd=S.bt=='none'?'':`<div class=bdr style=\"inset:${S.bi}mm;border:${S.bt=='double'?Math.max(3,S.bw):S.bw}px ${S.bt=='double'?'double':'solid'} ${S.bc}\"><\/div>`;\nconst body=`<div class=cc style=\"column-count:${nc};column-gap:${S.cg}mm;${S.cr==1&&nc>1?'column-rule:1px solid #999':''}\">${p.qs.map((q,j)=>q.kind=='stim'?stimH(q,pi+'_'+j):qh(q,++st.n,nc,pi+'_'+j)).join('')}<\/div>`;\nreturn`<div class=sw><div class=pl>পাতা ${D(pi+1)} / ${D(T)}<\/div><div class=pg style='${css}'>${wmh}${brd}${S.hdr==1?(pi==0||S.h1==0?full:cmp):''}<div class=bd>${body}<\/div><div class=ft>${cell('left')}${cell('center')}${cell('right')}<\/div><\/div><\/div>`}\n\nconst ov=cc=>cc.scrollHeight>cc.clientHeight+2||cc.scrollWidth>cc.clientWidth+2;\nfunction fillOf(cc){const k=cc.children;if(!k.length)return 0;const r=cc.getBoundingClientRect(),l=k[k.length-1].getBoundingClientRect(),nc=Math.max(1,+cc.style.columnCount||1);if(!r.height||!r.width)return 0;\nconst mmw=(window.PW||210)-(+S.ml||0)-(+S.mr||0),gap=(+S.cg||0)*r.width/mmw,pitch=(r.width+gap)/nc,ci=Math.floor((l.left-r.left+1)/pitch);return Math.max(0,(ci+(l.bottom-r.top)/r.height)/nc)}\nfunction pgStat(){const sws=[...document.querySelectorAll('#sheets .sw')];let bad=0,nq=0;\nsws.forEach((sw,i)=>{const cc=sw.querySelector('.cc'),el=document.querySelector('[data-pst=\"'+i+'\"]'),cnt=PG[i]?PG[i].qs.filter(q=>q.kind!='stim').length:0;nq+=cnt;if(!cc)return;const o=ov(cc),f=o?1:fillOf(cc);if(o)bad++;\nif(el){el.className='pst '+(o?'er':f<.6?'lo':'ok');el.textContent=D(cnt)+'টি প্রশ্ন · '+(o?'⚠ ভরে গেছে':'~'+D(Math.round(f*100))+'% ভরা')}});\nconst st=$('lyst');if(st)st.textContent='এখন মোট '+D(PG.length)+' পাতা · '+D(nq)+'টি প্রশ্ন'+(bad?' · ⚠ '+D(bad)+'টি পাতা ভরে গেছে':'')}\nconst decodeImgs=cc=>Promise.all([...cc.querySelectorAll('img')].filter(i=>!(i.complete&&i.naturalWidth)).map(i=>i.decode?i.decode().catch( <div class=panel><h2>🔐 Firestore Rules</h2><details><summary>নিয়মটা দেখুন ও কপি করুন</summary><p><button data-a=cr>📋 নিয়ম কপি করুন</button></p><pre>rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {
    function verified() { return request.auth != null && request.auth.token.email_verified == true; }
    function admin() { return verified() && request.auth.token.email == 'monju505@gmail.com'; }
    function me() { return /databases/$(db)/documents/access/$(request.auth.token.email.lower()); }
    function member(org) { return verified() && exists(me()) && get(me()).data.org == org; }
    match /{document=**} {
      allow read, write: if admin();
    }
    match /access/{email} {
      allow read: if verified() && request.auth.token.email.lower() == email;
    }
    match /orgs/{org} {
      allow read: if member(org);
    }
    match /orgs/{org}/pdfs/{id} {
      allow read: if member(org);
    }
    match /orgs/{org}/pdfs/{id}/chunks/{n} {
      allow read: if member(org);
    }
  }
}</pre></details></div>
